<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello from Netlify</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 2rem;
        }
        main {
            text-align: center;
            max-width: 32rem;
        }
        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1.125rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        a {
            color: #fff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Hello, world.</h1>
        <p>A simple vanilla HTML page, hosted on <a href="https://www.netlify.com">Netlify</a>.</p>
    </main>
    <script src="https://www.inflight.co/widget.js" data-workspace="vazovu9g" async></script>
